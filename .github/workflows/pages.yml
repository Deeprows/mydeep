name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * *'   # daily rebuild so pre-rendered matches stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site (pre-render data, SEO tags, sitemap)
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://deeprowss.com' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
